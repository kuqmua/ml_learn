<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title description"><title id="title">Причинная свёртка</title><desc id="description">Выход в момент 3 использует текущий и прошлый входы</desc><rect width="1200" height="550" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Причинная свёртка</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Выход в момент 3 использует текущий и прошлый входы</text><text x="48" y="136" fill="#14213d" font-size="21" font-weight="700" text-anchor="start">Входной сигнал</text><rect x="170" y="162" width="156" height="100" rx="14" fill="white" stroke="#d8e1ef" stroke-width="2"/><text x="248" y="203" fill="#d8e1ef" font-size="23" font-weight="700" text-anchor="middle">x0 = 1</text><text x="248" y="238" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">момент 0</text><rect x="360" y="162" width="156" height="100" rx="14" fill="white" stroke="#d8e1ef" stroke-width="2"/><text x="438" y="203" fill="#d8e1ef" font-size="23" font-weight="700" text-anchor="middle">x1 = 0</text><text x="438" y="238" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">момент 1</text><rect x="550" y="162" width="156" height="100" rx="14" fill="#e8efff" stroke="#2459c6" stroke-width="2"/><text x="628" y="203" fill="#2459c6" font-size="23" font-weight="700" text-anchor="middle">x2 = 2</text><text x="628" y="238" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">момент 2</text><rect x="740" y="162" width="156" height="100" rx="14" fill="#e8efff" stroke="#2459c6" stroke-width="2"/><text x="818" y="203" fill="#2459c6" font-size="23" font-weight="700" text-anchor="middle">x3 = 3</text><text x="818" y="238" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">момент 3</text><rect x="930" y="162" width="156" height="100" rx="14" fill="#fde9ec" stroke="#c84352" stroke-width="2"/><text x="1008" y="203" fill="#c84352" font-size="23" font-weight="700" text-anchor="middle">x4 = 9</text><text x="1008" y="238" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">момент 4</text><text x="550" y="304" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">прошлый вход × 2</text><text x="785" y="304" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">текущий вход × 1</text><text x="1008" y="304" fill="#c84352" font-size="15" font-weight="700" text-anchor="middle">будущее закрыто</text><line x1="628" y1="267" x2="600" y2="352" stroke="#2459c6" stroke-width="3" stroke-linecap="round" marker-end="url(#blue-arrow)"/><line x1="818" y1="267" x2="670" y2="352" stroke="#2459c6" stroke-width="3" stroke-linecap="round" marker-end="url(#blue-arrow)"/><line x1="980" y1="172" x2="1036" y2="252" stroke="#c84352" stroke-width="4" stroke-linecap="round"/><line x1="1036" y1="172" x2="980" y2="252" stroke="#c84352" stroke-width="4" stroke-linecap="round"/><rect x="424" y="368" width="352" height="105" rx="18" fill="#e4f6ee" stroke="#17845a" stroke-width="2"/><text x="600" y="408" fill="#14213d" font-size="23" font-weight="700" text-anchor="middle">y3 = 2·x2 + 1·x3</text><text x="600" y="446" fill="#17845a" font-size="22" font-weight="700" text-anchor="middle">2·2 + 1·3 = 7</text><text x="600" y="521" fill="#52627a" font-size="18" font-weight="600" text-anchor="middle">Изменение x4 не может изменить y3.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description"><title id="title">Fraction — доля целого</title><desc id="description">0 означает ничего, 1 означает целое; между ними — часть целого</desc><rect width="1200" height="520" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Fraction — доля целого</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">0 означает ничего, 1 означает целое; между ними — часть целого</text><rect x="44" y="132" width="344" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="68" y="177" fill="#2459c6" font-size="23" font-weight="700" text-anchor="start">fraction = 0.25</text><rect x="68" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="143" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><rect x="218" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><rect x="293" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><text x="68" y="308" fill="#14213d" font-size="18" font-weight="700" text-anchor="start">1 из 4 частей</text><text x="68" y="345" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">1/4 = 0.25</text><rect x="428" y="132" width="344" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="452" y="177" fill="#2459c6" font-size="23" font-weight="700" text-anchor="start">fraction = 0.50</text><rect x="452" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="527" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="602" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><rect x="677" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><text x="452" y="308" fill="#14213d" font-size="18" font-weight="700" text-anchor="start">2 из 4 частей</text><text x="452" y="345" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">2/4 = 0.50</text><rect x="812" y="132" width="344" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="836" y="177" fill="#2459c6" font-size="23" font-weight="700" text-anchor="start">fraction = 0.75</text><rect x="836" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="911" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="986" y="205" width="68" height="64" rx="5" fill="#2459c6" stroke="#2459c6" stroke-width="1.5"/><rect x="1061" y="205" width="68" height="64" rx="5" fill="white" stroke="#2459c6" stroke-width="1.5"/><text x="836" y="308" fill="#14213d" font-size="18" font-weight="700" text-anchor="start">3 из 4 частей</text><text x="836" y="345" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">3/4 = 0.75</text><rect x="91" y="411" width="1018" height="72" rx="16" fill="#e4f6ee" stroke="#17845a" stroke-width="1.5"/><text x="600" y="440" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Пример: случайное число 0.37 &lt; fraction 0.50</text><text x="600" y="468" fill="#17845a" font-size="17" font-weight="600" text-anchor="middle">значит, событие с вероятностью 0.50 произошло</text></g></svg>

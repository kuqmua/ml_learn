<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description"><title id="title">Скалярное произведение и угол</title><desc id="description">Один вектор a, три направления второго вектора b</desc><rect width="1200" height="510" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Скалярное произведение и угол</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Один вектор a, три направления второго вектора b</text><rect x="42" y="118" width="360" height="326" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="60" y="136" width="150" height="34" rx="17" fill="#e4f6ee" stroke="#e4f6ee" stroke-width="0"/><text x="135.0" y="159" fill="#17845a" font-size="15" font-weight="700" text-anchor="middle">Острый угол</text><line x1="74" y1="326" x2="370" y2="326" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><line x1="218" y1="362" x2="218" y2="204" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><circle cx="218" cy="326" r="4" fill="#14213d" stroke="none"/><line x1="218" y1="326" x2="273" y2="216" stroke="#2459c6" stroke-width="5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><line x1="218" y1="326" x2="328" y2="271" stroke="#d97725" stroke-width="5" stroke-linecap="round" marker-end="url(#orange-arrow)"/><text x="280" y="210" fill="#2459c6" font-size="15" font-weight="700" text-anchor="start">a = [1, 2]</text><text x="336" y="262" fill="#d97725" font-size="15" font-weight="700" text-anchor="start">b = [2, 1]</text><text x="222" y="405" fill="#17845a" font-size="18" font-weight="700" text-anchor="middle">1·2 + 2·1 = 4</text><rect x="430" y="118" width="360" height="326" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="448" y="136" width="150" height="34" rx="17" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><text x="523.0" y="159" fill="#d97725" font-size="15" font-weight="700" text-anchor="middle">Прямой угол</text><line x1="462" y1="326" x2="758" y2="326" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><line x1="606" y1="362" x2="606" y2="204" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><circle cx="606" cy="326" r="4" fill="#14213d" stroke="none"/><line x1="606" y1="326" x2="661" y2="216" stroke="#2459c6" stroke-width="5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><line x1="606" y1="326" x2="496" y2="271" stroke="#d97725" stroke-width="5" stroke-linecap="round" marker-end="url(#orange-arrow)"/><text x="668" y="210" fill="#2459c6" font-size="15" font-weight="700" text-anchor="start">a = [1, 2]</text><text x="488" y="262" fill="#d97725" font-size="15" font-weight="700" text-anchor="end">b = [-2, 1]</text><text x="610" y="405" fill="#d97725" font-size="18" font-weight="700" text-anchor="middle">1·(-2) + 2·1 = 0</text><rect x="818" y="118" width="360" height="326" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="836" y="136" width="150" height="34" rx="17" fill="#fde9ec" stroke="#fde9ec" stroke-width="0"/><text x="911.0" y="159" fill="#c84352" font-size="15" font-weight="700" text-anchor="middle">Тупой угол</text><line x1="850" y1="326" x2="1146" y2="326" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><line x1="994" y1="362" x2="994" y2="204" stroke="#bac7d9" stroke-width="1.5" stroke-linecap="round"/><circle cx="994" cy="326" r="4" fill="#14213d" stroke="none"/><line x1="994" y1="326" x2="1049" y2="216" stroke="#2459c6" stroke-width="5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><line x1="994" y1="326" x2="859" y2="281" stroke="#d97725" stroke-width="5" stroke-linecap="round" marker-end="url(#orange-arrow)"/><text x="1056" y="210" fill="#2459c6" font-size="15" font-weight="700" text-anchor="start">a = [1, 2]</text><text x="851" y="272" fill="#d97725" font-size="15" font-weight="700" text-anchor="end">b = [-3, 1]</text><text x="998" y="405" fill="#c84352" font-size="18" font-weight="700" text-anchor="middle">1·(-3) + 2·1 = -1</text><text x="600" y="481" fill="#52627a" font-size="17" font-weight="400" text-anchor="middle">Знак результата зависит от угла; нулевой вектор не имеет направления.</text></g></svg>

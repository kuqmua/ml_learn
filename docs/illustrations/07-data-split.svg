<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title description"><title id="title">Разделение данных без утечки</title><desc id="description">Три части данных отвечают на разные вопросы</desc><rect width="1200" height="545" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Разделение данных без утечки</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Три части данных отвечают на разные вопросы</text><rect x="426" y="113" width="348" height="74" rx="16" fill="#e8efff" stroke="#2459c6" stroke-width="1.5"/><text x="600" y="146" fill="#2459c6" font-size="23" font-weight="700" text-anchor="middle">Исходные данные</text><text x="600" y="172" fill="#52627a" font-size="15" font-weight="400" text-anchor="middle">разделить до настройки модели</text><line x1="600" y1="187" x2="214" y2="236" stroke="#52627a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="44" y="248" width="340" height="218" rx="18" fill="white" stroke="#2459c6" stroke-width="2"/><rect x="64" y="267" width="126" height="34" rx="17" fill="#e8efff" stroke="#e8efff" stroke-width="0"/><text x="127.0" y="290" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">train</text><text x="64" y="340" fill="#14213d" font-size="17" font-weight="700" text-anchor="start">Подогнать преобразования</text><text x="64" y="379" fill="#52627a" font-size="15" font-weight="400" text-anchor="start">Обучить параметры модели</text><line x1="64" y1="403" x2="364" y2="403" stroke="#d8e1ef" stroke-width="1" stroke-linecap="round"/><text x="64" y="440" fill="#2459c6" font-size="15" font-weight="700" text-anchor="start">Роль данных неизменна</text><line x1="600" y1="187" x2="600" y2="236" stroke="#52627a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="430" y="248" width="340" height="218" rx="18" fill="white" stroke="#d97725" stroke-width="2"/><rect x="450" y="267" width="126" height="34" rx="17" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><text x="513.0" y="290" fill="#d97725" font-size="15" font-weight="700" text-anchor="middle">validation</text><text x="450" y="340" fill="#14213d" font-size="17" font-weight="700" text-anchor="start">Выбрать настройки и порог</text><text x="450" y="379" fill="#52627a" font-size="15" font-weight="400" text-anchor="start">Не переобучать преобразования</text><line x1="450" y1="403" x2="750" y2="403" stroke="#d8e1ef" stroke-width="1" stroke-linecap="round"/><text x="450" y="440" fill="#d97725" font-size="15" font-weight="700" text-anchor="start">Роль данных неизменна</text><line x1="600" y1="187" x2="986" y2="236" stroke="#52627a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="816" y="248" width="340" height="218" rx="18" fill="white" stroke="#17845a" stroke-width="2"/><rect x="836" y="267" width="126" height="34" rx="17" fill="#e4f6ee" stroke="#e4f6ee" stroke-width="0"/><text x="899.0" y="290" fill="#17845a" font-size="15" font-weight="700" text-anchor="middle">test</text><text x="836" y="340" fill="#14213d" font-size="17" font-weight="700" text-anchor="start">Оценить один раз в конце</text><text x="836" y="379" fill="#52627a" font-size="15" font-weight="400" text-anchor="start">Не выбирать по нему настройки</text><line x1="836" y1="403" x2="1136" y2="403" stroke="#d8e1ef" stroke-width="1" stroke-linecap="round"/><text x="836" y="440" fill="#17845a" font-size="15" font-weight="700" text-anchor="start">Роль данных неизменна</text><text x="600" y="512" fill="#14213d" font-size="17" font-weight="600" text-anchor="middle">Среднее, словарь и другие обучаемые преобразования вычисляются только на train.</text></g></svg>

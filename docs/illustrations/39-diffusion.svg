<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title description"><title id="title">От сигнала к шуму</title><desc id="description">Чистый сигнал 2, фиксированный шум −1, меняется только ᾱ</desc><rect width="1200" height="545" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">От сигнала к шуму</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Чистый сигнал 2, фиксированный шум −1, меняется только ᾱ</text><rect x="44" y="120" width="1112" height="68" rx="16" fill="#e8efff" stroke="#2459c6" stroke-width="1.5"/><text x="600" y="164" fill="#2459c6" font-size="23" font-weight="700" text-anchor="middle">x = √ᾱ · 2  +  √(1−ᾱ) · (−1)</text><rect x="44" y="219" width="254" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="63" y="237" width="122" height="34" rx="17" fill="#e8efff" stroke="#e8efff" stroke-width="0"/><text x="124.0" y="260" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">ᾱ = 1.00</text><text x="63" y="317" fill="#14213d" font-size="25" font-weight="700" text-anchor="start">выход 2.00</text><text x="63" y="353" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">2.00 + 0.00</text><rect x="63" y="388" width="216" height="20" rx="10" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><rect x="63" y="388" width="216.0" height="20" rx="10" fill="#2459c6" stroke="#2459c6" stroke-width="0"/><text x="63" y="437" fill="#2459c6" font-size="13" font-weight="600" text-anchor="start">синий: доля ᾱ</text><line x1="301" y1="337" x2="326" y2="337" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="330" y="219" width="254" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="349" y="237" width="122" height="34" rx="17" fill="#e8efff" stroke="#e8efff" stroke-width="0"/><text x="410.0" y="260" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">ᾱ = 0.75</text><text x="349" y="317" fill="#14213d" font-size="25" font-weight="700" text-anchor="start">выход 1.23</text><text x="349" y="353" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">1.73 − 0.50</text><rect x="349" y="388" width="216" height="20" rx="10" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><rect x="349" y="388" width="162.0" height="20" rx="10" fill="#2459c6" stroke="#2459c6" stroke-width="0"/><text x="349" y="437" fill="#2459c6" font-size="13" font-weight="600" text-anchor="start">синий: доля ᾱ</text><line x1="587" y1="337" x2="612" y2="337" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="616" y="219" width="254" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="635" y="237" width="122" height="34" rx="17" fill="#e8efff" stroke="#e8efff" stroke-width="0"/><text x="696.0" y="260" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">ᾱ = 0.25</text><text x="635" y="317" fill="#14213d" font-size="25" font-weight="700" text-anchor="start">выход 0.13</text><text x="635" y="353" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">1.00 − 0.87</text><rect x="635" y="388" width="216" height="20" rx="10" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><rect x="635" y="388" width="54.0" height="20" rx="10" fill="#2459c6" stroke="#2459c6" stroke-width="0"/><text x="635" y="437" fill="#2459c6" font-size="13" font-weight="600" text-anchor="start">синий: доля ᾱ</text><line x1="873" y1="337" x2="898" y2="337" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="902" y="219" width="254" height="250" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><rect x="921" y="237" width="122" height="34" rx="17" fill="#e8efff" stroke="#e8efff" stroke-width="0"/><text x="982.0" y="260" fill="#2459c6" font-size="15" font-weight="700" text-anchor="middle">ᾱ = 0.00</text><text x="921" y="317" fill="#14213d" font-size="25" font-weight="700" text-anchor="start">выход −1.00</text><text x="921" y="353" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">0.00 − 1.00</text><rect x="921" y="388" width="216" height="20" rx="10" fill="#fff0df" stroke="#fff0df" stroke-width="0"/><text x="921" y="437" fill="#2459c6" font-size="13" font-weight="600" text-anchor="start">синий: доля ᾱ</text><text x="600" y="515" fill="#52627a" font-size="17" font-weight="600" text-anchor="middle">При ᾱ = 1 остаётся чистый сигнал; при ᾱ = 0 остаётся только шум.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title description"><title id="title">Матрица ошибок классификации</title><desc id="description">Строки показывают истину, столбцы — прогноз модели</desc><rect width="1200" height="540" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Матрица ошибок классификации</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Строки показывают истину, столбцы — прогноз модели</text><text x="485" y="130" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Прогноз модели</text><text x="442" y="166" fill="#2459c6" font-size="16" font-weight="700" text-anchor="middle">положительный</text><text x="742" y="166" fill="#2459c6" font-size="16" font-weight="700" text-anchor="middle">отрицательный</text><text x="140" y="320" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Истинный класс</text><text x="250" y="267" fill="#52627a" font-size="15" font-weight="700" text-anchor="middle">положительный</text><text x="250" y="414" fill="#52627a" font-size="15" font-weight="700" text-anchor="middle">отрицательный</text><rect x="302" y="183" width="280" height="130" rx="14" fill="#e4f6ee" stroke="#17845a" stroke-width="1.5"/><text x="322" y="225" fill="#17845a" font-size="27" font-weight="700" text-anchor="start">TP</text><text x="322" y="259" fill="#14213d" font-size="15" font-weight="700" text-anchor="start">нашли положительный</text><text x="322" y="286" fill="#52627a" font-size="14" font-weight="400" text-anchor="start">истина +, прогноз +</text><rect x="602" y="183" width="280" height="130" rx="14" fill="#fff0df" stroke="#d97725" stroke-width="1.5"/><text x="622" y="225" fill="#d97725" font-size="27" font-weight="700" text-anchor="start">FN</text><text x="622" y="259" fill="#14213d" font-size="15" font-weight="700" text-anchor="start">пропустили положительный</text><text x="622" y="286" fill="#52627a" font-size="14" font-weight="400" text-anchor="start">истина +, прогноз −</text><rect x="302" y="330" width="280" height="130" rx="14" fill="#fde9ec" stroke="#c84352" stroke-width="1.5"/><text x="322" y="372" fill="#c84352" font-size="27" font-weight="700" text-anchor="start">FP</text><text x="322" y="406" fill="#14213d" font-size="15" font-weight="700" text-anchor="start">ложная тревога</text><text x="322" y="433" fill="#52627a" font-size="14" font-weight="400" text-anchor="start">истина −, прогноз +</text><rect x="602" y="330" width="280" height="130" rx="14" fill="#e8efff" stroke="#2459c6" stroke-width="1.5"/><text x="622" y="372" fill="#2459c6" font-size="27" font-weight="700" text-anchor="start">TN</text><text x="622" y="406" fill="#14213d" font-size="15" font-weight="700" text-anchor="start">нашли отрицательный</text><text x="622" y="433" fill="#52627a" font-size="14" font-weight="400" text-anchor="start">истина −, прогноз −</text><rect x="920" y="183" width="234" height="277" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="940" y="219" fill="#14213d" font-size="19" font-weight="700" text-anchor="start">Пример урока</text><text x="940" y="260" fill="#52627a" font-size="16" font-weight="400" text-anchor="start">Истина:   +  −  +  −</text><text x="940" y="293" fill="#52627a" font-size="16" font-weight="400" text-anchor="start">Прогноз: +  +  −  −</text><line x1="940" y1="316" x2="1134" y2="316" stroke="#d8e1ef" stroke-width="1" stroke-linecap="round"/><text x="940" y="354" fill="#14213d" font-size="15" font-weight="400" text-anchor="start">По одному объекту</text><text x="940" y="382" fill="#14213d" font-size="15" font-weight="400" text-anchor="start">в каждой ячейке.</text><text x="940" y="433" fill="#2459c6" font-size="14" font-weight="700" text-anchor="start">TP+FN = все +</text><text x="600" y="508" fill="#52627a" font-size="17" font-weight="400" text-anchor="middle">Каждый объект попадает ровно в одну ячейку.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title description"><title id="title">Как работает причинное внимание</title><desc id="description">Запросы и ключи задают веса, значения V дают содержимое выхода</desc><rect width="1200" height="610" fill="#f8fbff"/><defs>
      <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2459c6"/></marker>
      <marker id="orange-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97725"/></marker>
      <marker id="gray-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52627a"/></marker>
    </defs><g font-family="DejaVu Sans, Arial, sans-serif"><text x="48" y="56" fill="#14213d" font-size="30" font-weight="700" text-anchor="start">Как работает причинное внимание</text><text x="48" y="89" fill="#52627a" font-size="17" font-weight="400" text-anchor="start">Запросы и ключи задают веса, значения V дают содержимое выхода</text><rect x="34" y="129" width="198" height="95" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="133" y="169" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Q × Kᵀ</text><text x="133" y="200" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">оценки</text><line x1="236" y1="177" x2="258" y2="177" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="262" y="129" width="198" height="95" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="361" y="169" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Маска</text><text x="361" y="200" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">будущее закрыто</text><line x1="464" y1="177" x2="486" y2="177" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="490" y="129" width="198" height="95" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="589" y="169" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">softmax</text><text x="589" y="200" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">сумма строки = 1</text><line x1="692" y1="177" x2="714" y2="177" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><rect x="718" y="129" width="198" height="95" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="817" y="169" fill="#14213d" font-size="20" font-weight="700" text-anchor="middle">Вес × V</text><text x="817" y="200" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">смесь значений</text><rect x="944" y="129" width="222" height="95" rx="16" fill="#e4f6ee" stroke="#17845a" stroke-width="1.5"/><text x="1055" y="169" fill="#17845a" font-size="19" font-weight="700" text-anchor="middle">Новый вектор</text><text x="1055" y="200" fill="#52627a" font-size="14" font-weight="400" text-anchor="middle">для каждой позиции</text><line x1="922" y1="177" x2="940" y2="177" stroke="#52627a" stroke-width="2" stroke-linecap="round" marker-end="url(#gray-arrow)"/><text x="80" y="290" fill="#14213d" font-size="20" font-weight="700" text-anchor="start">Веса внимания после маски и softmax</text><text x="100" y="347" fill="#52627a" font-size="15" font-weight="400" text-anchor="start">запрос ↓ / ключ →</text><text x="336" y="394" fill="#52627a" font-size="15" font-weight="600" text-anchor="end">позиция 1</text><rect x="365" y="350" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="432" y="385" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">1.00</text><rect x="517" y="350" width="135" height="54" rx="9" fill="#fde9ec" stroke="#c84352" stroke-width="1"/><text x="584" y="385" fill="#c84352" font-size="20" font-weight="700" text-anchor="middle">0</text><rect x="669" y="350" width="135" height="54" rx="9" fill="#fde9ec" stroke="#c84352" stroke-width="1"/><text x="736" y="385" fill="#c84352" font-size="20" font-weight="700" text-anchor="middle">0</text><text x="336" y="460" fill="#52627a" font-size="15" font-weight="600" text-anchor="end">позиция 2</text><rect x="365" y="416" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="432" y="451" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">0.30</text><rect x="517" y="416" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="584" y="451" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">0.70</text><rect x="669" y="416" width="135" height="54" rx="9" fill="#fde9ec" stroke="#c84352" stroke-width="1"/><text x="736" y="451" fill="#c84352" font-size="20" font-weight="700" text-anchor="middle">0</text><text x="336" y="526" fill="#52627a" font-size="15" font-weight="600" text-anchor="end">позиция 3</text><rect x="365" y="482" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="432" y="517" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">0.20</text><rect x="517" y="482" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="584" y="517" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">0.30</text><rect x="669" y="482" width="135" height="54" rx="9" fill="#e8efff" stroke="#2459c6" stroke-width="1"/><text x="736" y="517" fill="#2459c6" font-size="20" font-weight="700" text-anchor="middle">0.50</text><text x="432" y="336" fill="#52627a" font-size="15" font-weight="600" text-anchor="middle">позиция 1</text><text x="584" y="336" fill="#52627a" font-size="15" font-weight="600" text-anchor="middle">позиция 2</text><text x="736" y="336" fill="#52627a" font-size="15" font-weight="600" text-anchor="middle">позиция 3</text><rect x="860" y="336" width="292" height="190" rx="16" fill="white" stroke="#d8e1ef" stroke-width="1.5"/><text x="881" y="371" fill="#c84352" font-size="18" font-weight="700" text-anchor="start">Красные ячейки</text><text x="881" y="401" fill="#14213d" font-size="16" font-weight="400" text-anchor="start">всегда имеют вес 0:</text><text x="881" y="431" fill="#14213d" font-size="16" font-weight="400" text-anchor="start">прошлое не видит будущее.</text><line x1="881" y1="451" x2="1132" y2="451" stroke="#d8e1ef" stroke-width="1" stroke-linecap="round"/><text x="881" y="487" fill="#2459c6" font-size="15" font-weight="700" text-anchor="start">Сумма каждой строки = 1</text><text x="600" y="581" fill="#52627a" font-size="18" font-weight="400" text-anchor="middle">Вес определяет вклад значения V в выход соответствующей позиции.</text></g></svg>
